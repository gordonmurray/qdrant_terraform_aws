name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate and test module
        working-directory: modules/qdrant
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate examples
        run: |
          for d in examples/single-node examples/cluster examples/production; do
            (cd "$d" && terraform init -backend=false -input=false -lockfile=readonly && terraform validate)
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: modules/qdrant
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: shellcheck scripts/*.sh
      - name: Render and lint startup scripts
        run: python3 tests/check_templates.py
      - name: Test plan policy, replacement and client checks
        run: python3 -m unittest discover -s tests -v
